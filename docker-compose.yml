services:
  typeorm-postgres:
    container_name: nestjs-typeorm-postgres
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${TYPEORM_POSTGRES_USER}
      POSTGRES_PASSWORD: ${TYPEORM_POSTGRES_PASSWORD}
      POSTGRES_DB: ${TYPEORM_POSTGRES_DB_NAME}
    ports:
      - '${TYPEORM_POSTGRES_PORT}:5432'
    volumes:
      - typeorm_postgres_data:/var/lib/postgresql
    networks:
      - nestjs-education-project
  prisma-postgres:
    container_name: nestjs-prisma-postgres
    image: postgres:18
    restart: always
    environment:
      POSTGRES_USER: ${PRISMA_POSTGRES_USER}
      POSTGRES_PASSWORD: ${PRISMA_POSTGRES_PASSWORD}
      POSTGRES_DB: ${PRISMA_POSTGRES_DB_NAME}
    ports:
      - '${PRISMA_POSTGRES_PORT}:5432'
    volumes:
      - prisma_postgres_data:/var/lib/postgresql
    networks:
      - nestjs-education-project
volumes:
  typeorm_postgres_data:
  prisma_postgres_data:

networks:
  nestjs-education-project:
